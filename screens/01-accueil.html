<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>html{background:#0d0c0b}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velnora — Villa Aurea — Accueil</title>
<link rel="stylesheet" href="../css/velnora-shared.css">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="icon" href="../assets/favicon-32.png">
<meta name="theme-color" content="#0d0c0b">
<link rel="preconnect" href="https://api.open-meteo.com">
<style>
  .hero-block{position:relative;height:46vh;min-height:320px;max-height:440px;overflow:hidden;border-radius:0 0 18px 18px;flex-shrink:0;background:var(--ink-3);}
  .hero-photo{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;object-position:center 58%;animation:heroDrift 14s var(--ease-signature) both;will-change:transform;transform:translateZ(0);backface-visibility:hidden;}
  @keyframes heroDrift{ from{transform:scale(1.03) translate(-1%,-1%);} to{transform:scale(1) translate(0,0);} }
  @media (prefers-reduced-motion: reduce){ .hero-photo{animation:none;} }
  .hero-block .plate{position:absolute;inset:0;background:linear-gradient(180deg, rgba(10,9,8,.05) 0%, rgba(10,9,8,.1) 55%, rgba(13,12,11,.85) 92%, var(--ink) 100%);}

  .topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 20px) var(--space-5) 0;}
  @media (min-width:720px){
    .topbar{left:50%;right:auto;margin-left:-240px;width:100%;max-width:480px;}
  }
  .monogram{width:27px;height:27px;opacity:.94;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4));}

  .weather-chip{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:12.5px;font-weight:500;color:var(--paper);background:rgba(20,19,17,.55);border:1px solid rgba(239,236,229,.16);padding:6px 12px;border-radius:2px;}
  .weather-chip svg{width:14px;height:14px;opacity:.85;}

  .body-col{padding:22px var(--space-5) calc(env(safe-area-inset-bottom,0px) + 40px);}

  .phase-eyebrow{font-family:var(--font-display);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass-light);margin:0 0 12px;font-weight:600;}
  .phase-message{font-family:var(--font-editorial);font-weight:400;font-size:30px;line-height:1.25;color:var(--paper);margin:0 0 10px;}
  .phase-submessage{font-family:var(--font-body);font-weight:300;font-size:14.5px;line-height:1.55;color:var(--stone-dim);margin:0 0 28px;max-width:320px;}

  .primary-action{display:flex;align-items:center;gap:14px;padding:16px 17px;margin-bottom:var(--space-4);cursor:pointer;}
  .primary-action .ic{width:25px;height:25px;flex-shrink:0;color:var(--brass-light);}
  .primary-action .ic svg{width:100%;height:100%;}
  .primary-action .txt{flex:1;min-width:0;}
  .primary-action .eb{font-family:var(--font-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-light);margin-bottom:4px;}
  .primary-action .val{font-family:var(--font-body);font-size:15.5px;font-weight:400;color:var(--paper);}

  .quick-access{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .qa-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:76px;padding:14px 6px;cursor:pointer;}
  .qa-item .ic{width:21px;height:21px;color:var(--paper);opacity:.92;transition:opacity var(--duration-micro) var(--ease-signature);}
  .qa-item .ic svg{width:100%;height:100%;}
  .qa-item:active .ic{opacity:1;}
  .qa-item .lbl{font-family:var(--font-body);font-size:11px;font-weight:400;color:var(--paper-2);text-align:center;line-height:1.25;}
</style>
</head>
<body>

<div class="device">
  <div class="scroll-area" id="scroll">

    <div class="hero-block">
      <img class="hero-photo" src="../assets/images/hero-exterieur.jpg" alt="Vue extérieure de la Villa Aurea" fetchpriority="high" decoding="async">
      <div class="plate"></div>
      <div class="topbar">
        <div class="monogram">
          <svg class="mono-svg" viewBox="0 0 100 100" fill="none" stroke="#efece5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="3" width="90" height="94" rx="16" ry="16"/>
            <path d="M27,15 L50,82 L73,15"/>
          </svg>
        </div>
        <div class="weather-chip enter" id="weatherChip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          <span class="wc-temp">26°</span>
        </div>
      </div>
    </div>

    <div class="body-col">
      <div class="phase-eyebrow enter">Velnora · Villa Aurea</div>
      <div class="phase-message enter enter-1">Bonjour, Élise.</div>
      <div class="phase-submessage enter enter-2">La villa est à vous jusqu'au 8 septembre.</div>

      <div class="primary-action glass-card enter enter-3" onclick="location.href='02-wifi-acces.html'">
        <div class="ic"><svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M30 42 a4 4 0 1 1 0.1 0 M18 32 a17 17 0 0 1 24 0 M10 24 a29 29 0 0 1 40 0"/></svg></div>
        <div class="txt"><div class="eb">Wi-Fi</div><div class="val">Villa-Aurea · Aurea2026</div></div>
      </div>

      <div class="quick-access enter enter-4">
        <div class="qa-item glass-card" onclick="location.href='03-checkin-checkout.html'">
          <div class="ic"><svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="14" y="14" width="32" height="32"/><path d="M14 22 h32 M22 14 v8"/></svg></div>
          <div class="lbl">Check-in /<br>Check-out</div>
        </div>
        <div class="qa-item glass-card" onclick="location.href='04-contacts-utiles.html'">
          <div class="ic"><svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="30" cy="24" r="10"/><path d="M14 46 a16 16 0 0 1 32 0"/></svg></div>
          <div class="lbl">Votre<br>Conciergerie</div>
        </div>
        <div class="qa-item glass-card" onclick="location.href='06-la-propriete.html'">
          <div class="ic"><svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 28 L30 12 L48 28 M17 26 V47 H43 V26"/></svg></div>
          <div class="lbl">La<br>Villa</div>
        </div>
        <div class="qa-item glass-card" onclick="location.href='05-guide-pratique.html'">
          <div class="ic"><svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="16" y="12" width="28" height="36" rx="2"/><path d="M22 22 h16 M22 30 h16 M22 38 h10"/></svg></div>
          <div class="lbl">Guide de<br>la Villa</div>
        </div>
        <div class="qa-item glass-card" onclick="location.href='07-recommandations.html'">
          <div class="ic"><svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M30 47 C30 47 44 33 44 23 A14 14 0 1 0 16 23 C16 33 30 47 30 47 Z"/><circle cx="30" cy="22" r="4.5"/></svg></div>
          <div class="lbl">Sélection<br>Camille</div>
        </div>
        <div class="qa-item glass-card" onclick="location.href='08-depart.html'">
          <div class="ic"><svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 16 H32 V44 H14 M38 30 H48 M42 24 L48 30 L42 36"/></svg></div>
          <div class="lbl">Départ</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="../js/velnora-shared.js"></script>
<script>
  // Presqu'île de Giens, Hyères — coordonnées de la propriété pilote.
  initWeather(43.0350, 6.1420);

  // Parallax discret : la photo suit le scroll (le bandeau logo/météo
  // reste fixe en haut de l'écran, en position:fixed géré nativement
  // par le navigateur — aussi fluide que le bouton Accueil).
  (function heroParallax(){
    const photo = document.querySelector('.hero-photo');
    if (!photo) return;
    photo.addEventListener('animationend', () => { photo.style.animation = 'none'; }, {once:true});
    let ticking = false;
    function update(){
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      photo.style.transform = `translate3d(0, ${y * 0.35}px, 0) scale(${1 + Math.min(y, 200) * 0.0007})`;
      ticking = false;
    }
    window.addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(update); } }, {passive:true});
  })();

  // Salutation dynamique selon l'heure locale — ton premium, jamais répétitive
  // d'un écran à l'autre (seul l'Accueil salue ; les autres écrans n'y reviennent pas).
  function getGreeting(){
    const h = new Date().getHours();
    if (h < 12) return 'Bonjour';
    if (h < 18) return 'Bon après-midi';
    return 'Bonsoir';
  }

  // Personnalisation à partir des informations recueillies à l'accueil
  // concierge (prénom, dates). Repli silencieux sur le contenu par défaut
  // si l'écran est ouvert directement (aucune information enregistrée).
  (function personalize(){
    let guest = null;
    try{ guest = JSON.parse(localStorage.getItem('velnoraGuest') || 'null'); }catch(e){}

    // Séjour terminé : on garde le même écran (aucun nouvel écran, aucune
    // suppression d'accès) mais le message d'accueil laisse place à une
    // formule de clôture, sobre et toujours élégante. La navigation reste
    // entièrement fonctionnelle en dessous — une propriété peut très bien
    // choisir de laisser le lien ouvert au-delà du séjour.
    if (guest && guest.departure && typeof isStayEnded === 'function' && isStayEnded(guest.departure)){
      const msgEl = document.querySelector('.phase-message');
      const subEl = document.querySelector('.phase-submessage');
      const d = new Date(guest.departure + 'T00:00:00');
      const formatted = !isNaN(d) ? new Intl.DateTimeFormat('fr-FR', { day:'numeric', month:'long' }).format(d) : null;

      if (msgEl) msgEl.textContent = 'Votre séjour à la Villa Aurea s’est achevé.';
      if (subEl) subEl.textContent = formatted
        ? 'Cette expérience vous était réservée jusqu\'au ' + formatted + '.'
        : 'Cette expérience était réservée à la durée de votre séjour.';
      return;
    }

    const el = document.querySelector('.phase-message');
    const name = (guest && guest.firstName ? guest.firstName.trim() : 'Élise');
    if (el && name) el.textContent = getGreeting() + ', ' + name.charAt(0).toUpperCase() + name.slice(1) + '.';

    if (guest && guest.departure){
      const subEl = document.querySelector('.phase-submessage');
      const d = new Date(guest.departure + 'T00:00:00');
      if (subEl && !isNaN(d)){
        const formatted = new Intl.DateTimeFormat('fr-FR', { day:'numeric', month:'long' }).format(d);
        subEl.textContent = "La villa est à vous jusqu'au " + formatted + '.';
      }
    }
  })();
</script>

</body>
</html>
