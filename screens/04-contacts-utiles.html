<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>html{background:#0d0c0b}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velnora — Villa Aurea — Conciergerie</title>
<link rel="stylesheet" href="../css/velnora-shared.css">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="icon" href="../assets/favicon-32.png">
<meta name="theme-color" content="#0d0c0b">
<style>
  .device{background:radial-gradient(120% 70% at 50% -10%, #211c17 0%, var(--ink) 55%);}
  .section-label{font-family:var(--font-display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--stone-dim);margin:32px 0 10px;}
  .contact-row{display:flex;align-items:center;gap:14px;padding:18px;cursor:pointer;}
  .contact-row .ic{width:22px;height:22px;flex-shrink:0;color:var(--brass-light);}
  .contact-row .ic svg{width:100%;height:100%;}
  .contact-row .txt{flex:1;}
  .contact-row .nm{font-family:var(--font-body);font-size:15.5px;font-weight:400;color:var(--paper);}
  .contact-row .av{font-family:var(--font-body);font-size:12px;font-weight:300;color:var(--stone-dim);margin-top:3px;}
  .contact-row .call{width:34px;height:34px;border-radius:50%;border:1px solid rgba(239,236,229,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background-color var(--duration-micro) var(--ease-signature), border-color var(--duration-micro) var(--ease-signature);}
  .contact-row .call svg{width:14px;height:14px;color:var(--paper);}
  .contact-row:active .call{background:var(--brass-light);border-color:var(--brass-light);}
  .contact-row:active .call svg{color:var(--ink);}
  .emergency-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;font-family:var(--font-body);font-size:14px;font-weight:300;color:var(--paper-2);cursor:pointer;border-top:1px solid var(--hair);}
  .emergency-row:first-child{border-top:0;}
  .emergency-row .num{font-family:var(--font-display);font-weight:500;color:var(--paper);font-variant-numeric:tabular-nums;}
</style>
</head>
<body>

<div class="device">
  <div class="scroll-area" id="scroll">
    <div class="back-affordance" id="back" onclick="location.href='01-accueil.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5 L8 12 L15 19"/></svg>Accueil</div>

    <div class="page-head">
      <div class="page-col">
        <div class="screen-eyebrow enter">Velnora · Villa Aurea</div>
        <h1 class="screen-title enter enter-1">Conciergerie</h1>

        <div class="section-label enter enter-2">Ligne directe</div>
        <div class="glass-card enter enter-2">
          <a class="contact-row" href="tel:+33494582137" style="text-decoration:none;">
            <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h3l2 5-2.5 1.5a11 11 0 0 0 5 5L15 12l5 2v3a2 2 0 0 1-2 2C9.6 19 5 14.4 5 8a2 2 0 0 1 2-2z"/></svg></div>
            <div class="txt"><div class="nm">Conciergerie Aurea</div></div>
            <div class="call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/></svg></div>
          </a>
        </div>

        <div class="section-label enter enter-3">Votre interlocutrice</div>
        <div class="glass-card enter enter-3">
          <a class="contact-row" href="tel:+33647821590" style="text-decoration:none;">
            <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div>
            <div class="txt"><div class="nm">Camille</div><div class="av">Disponible en journée</div></div>
            <div class="call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/></svg></div>
          </a>
        </div>

        <div class="section-label enter enter-4">Numéros d'urgence</div>
        <div class="glass-card enter enter-4" style="padding:4px 16px;">
          <a class="emergency-row" href="tel:112" style="text-decoration:none;">Urgence européenne <span class="num">112</span></a>
          <a class="emergency-row" href="tel:15" style="text-decoration:none;">SAMU <span class="num">15</span></a>
          <a class="emergency-row" href="tel:17" style="text-decoration:none;">Police <span class="num">17</span></a>
          <a class="emergency-row" href="tel:18" style="text-decoration:none;">Pompiers <span class="num">18</span></a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/velnora-shared.js"></script>
<script>
  initBackAffordance();
</script>

</body>
</html>
