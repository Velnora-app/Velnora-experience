<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>html{background:#0d0c0b}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velnora — Villa Aurea — La Villa</title>
<link rel="stylesheet" href="../css/velnora-shared.css">
<link rel="preload" as="image" href="../assets/images/g04-piscine.jpg">
<link rel="preload" as="image" href="../assets/images/g03-terrasse.jpg">
<link rel="preload" as="image" href="../assets/images/g02-vue-mer.jpg">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="icon" href="../assets/favicon-32.png">
<meta name="theme-color" content="#0d0c0b">
<style>
  .device{background:var(--ink);}
  .cover{position:relative;height:340px;overflow:hidden;background:#221c17;}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg, rgba(20,19,17,0), var(--ink) 96%);pointer-events:none;}

  .narrative{font-family:var(--font-editorial);font-size:17px;font-weight:400;line-height:1.75;color:var(--paper-2);padding:26px var(--space-5) 4px;max-width:640px;margin:0 auto;}

  .location-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px var(--space-5) 22px;max-width:640px;margin:0 auto;}
  .location-txt{font-family:var(--font-body);font-size:13px;font-weight:300;color:var(--stone-dim);}
  .location-txt b{color:var(--paper-2);font-weight:400;}

  .strong-photos{display:flex;gap:12px;overflow-x:auto;padding:0 var(--space-5) 40px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:640px;margin:0 auto;}
  .strong-photos::-webkit-scrollbar{display:none;}
  .strong-photo{min-width:64%;scroll-snap-align:start;flex-shrink:0;}
  .strong-photo .img-wrap{height:180px;border-radius:2px;}
  .strong-photo .cap{font-family:var(--font-display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone-dim);margin-top:9px;}
</style>
</head>
<body>

<div class="device">
  <div class="scroll-area" id="scroll">
    <div class="back-affordance" id="back" onclick="location.href='01-accueil.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5 L8 12 L15 19"/></svg>Accueil</div>

    <div class="cover">
      <img src="../assets/images/hero-exterieur.jpg" alt="La Villa Aurea et sa piscine à l'heure bleue" loading="eager" decoding="async" fetchpriority="high">
    </div>

    <div class="page-col">
      <div class="narrative enter">Perchée face à l'horizon, la Villa Aurea ouvre chacune de ses pièces sur la mer. Un lieu pensé pour les journées longues au bord de l'eau et les soirées qui s'étirent sous la pergola, entre pierre claire et lumière du soir.</div>

      <div class="location-row enter enter-1">
        <div class="location-txt">Hyères, <b>France</b></div>
        <a class="vln-btn vln-btn-ghost" href="https://www.google.com/maps/search/?api=1&query=43.0330%2C6.1310" onclick="event.preventDefault(); openInMaps(43.0330, 6.1310, 'Villa Aurea, Hyères');">Voir sur la carte</a>
      </div>

      <div class="strong-photos enter enter-2">
        <div class="strong-photo" onclick="galleryOpen(0)">
          <div class="img-wrap"><img class="img-fill" src="../assets/images/g04-piscine.jpg" alt="Vue aérienne de la piscine et de la villa au crépuscule" loading="eager" decoding="async"></div>
          <div class="cap">Piscine</div>
        </div>
        <div class="strong-photo" onclick="galleryOpen(1)">
          <div class="img-wrap"><img class="img-fill" src="../assets/images/g03-terrasse.jpg" alt="Terrasse couverte et salle à manger extérieure vues d'en haut" loading="eager" decoding="async"></div>
          <div class="cap">Terrasse</div>
        </div>
        <div class="strong-photo" onclick="galleryOpen(2)">
          <div class="img-wrap"><img class="img-fill" src="../assets/images/g02-vue-mer.jpg" alt="Vue sur la mer et les îles depuis la Villa Aurea" loading="eager" decoding="async"></div>
          <div class="cap">Vue mer</div>
        </div>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-close" onclick="galleryClose()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5 L8 12 L15 19"/></svg>
      La Villa
    </div>
    <div class="lightbox-stage">
      <button class="lightbox-edge prev" aria-label="Photo précédente" onclick="galleryStep(-1)"></button>
      <img id="lightboxImg" src="" alt="" decoding="async">
      <button class="lightbox-edge next" aria-label="Photo suivante" onclick="galleryStep(1)"></button>
    </div>
    <div class="lightbox-foot"><div class="lightbox-cap" id="lightboxCap"></div></div>
  </div>
</div>

<script src="../js/velnora-shared.js"></script>
<script>
  initBackAffordance();
  galleryInit([
    {src:'../assets/images/g04-piscine.jpg', alt:'Vue aérienne de la piscine et de la villa au crépuscule', cap:'Piscine'},
    {src:'../assets/images/g03-terrasse.jpg', alt:'Terrasse couverte et salle à manger extérieure vues d\'en haut', cap:'Terrasse'},
    {src:'../assets/images/g02-vue-mer.jpg', alt:'Vue sur la mer et les îles depuis la Villa Aurea', cap:'Vue mer'}
  ]);
  galleryInitSwipe();
</script>

</body>
</html>
